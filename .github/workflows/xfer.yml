name: xfer
on:
  push:
    branches: [xfer]
    paths: ['xfer/req.json']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the encrypted blob and store it on this branch
        run: |
          URL=$(jq -r .url xfer/req.json); SHA=$(jq -r .sha256 xfer/req.json)
          curl -fsSL --retry 3 -A "Mozilla/5.0 (X11; Linux x86_64)" "$URL" -o xfer/blob.bin
          echo "$SHA  xfer/blob.bin" | sha256sum -c -
          git config user.name "xfer-bot"; git config user.email "xfer-bot@users.noreply.github.com"
          git add xfer/blob.bin; git commit -m "Store encrypted blob"; git push
